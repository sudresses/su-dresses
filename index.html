<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>SU Dresses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: right-hand burgundy sidebar + cream workspace (RTL). Mobile: bottom tab bar + sheets. */
:root{
  --brand:#4a181c; --brand2:#5e1f24; --accent:#8a5a55; --sand:#e9dfd3; --cream:#faf6f1;
  --card:#ffffff; --ink:#3a1216; --muted:#8a7570; --line:#e7dcd2;
  --good:#3f7a58; --bad:#b44a5f; --warn:#a97a1f; --info:#5b7fa3;
  --good-bg:#e4f0e9; --bad-bg:#f6e3e7; --warn-bg:#f8efd9; --info-bg:#e3ebf3;
  --font:'Cairo','Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
}
:root[data-pal="rose"]{--brand:#6e1b3a;--brand2:#7f2548;--accent:#b0587a;--sand:#f0dde4;--cream:#fcf5f7;--ink:#4a1226;--line:#efd9e0}
:root[data-pal="navy"]{--brand:#1d2d54;--brand2:#27396a;--accent:#5d77a6;--sand:#dfe4ee;--cream:#f6f8fb;--ink:#17223f;--line:#d9dfeb;--muted:#6f7a92}
:root[data-pal="latte"]{--brand:#5b3a26;--brand2:#6c4630;--accent:#a07858;--sand:#eadfce;--cream:#fbf7f0;--ink:#3d2616;--line:#e6d9c6}
:root[data-pal="plum"]{--brand:#4b1f55;--brand2:#5d2a69;--accent:#8e5b9a;--sand:#e8dcee;--cream:#faf6fc;--ink:#35163d;--line:#e4d6ea}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--card)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.ic{width:20px;height:20px;flex:none}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100%}
.side{background:linear-gradient(180deg,var(--brand),var(--brand2));color:#f6e9e4;padding:18px 12px;padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto}
.logo{padding:6px 10px 18px;display:flex;flex-direction:column}
.logo b{font-size:22px;font-weight:800;letter-spacing:.3px}
.logo small{opacity:.7;font-size:12px}
.nv{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:inherit;text-decoration:none;font-weight:600;border:0;background:none;width:100%;text-align:right}
.nv:hover{background:rgba(255,255,255,.08)}
.nv.on{background:rgba(255,255,255,.2)}
.me{margin-top:auto;border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px}
.me .av{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:800}
.me small{opacity:.7;display:block;line-height:1.2}
.me button{margin-inline-start:auto;background:none;border:0;color:inherit;opacity:.8}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px)) 12px max(16px,env(safe-area-inset-right,0px))}
.top h1{font-size:22px;margin:0;font-weight:800;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--cream);display:grid;place-items:center;position:relative;flex:none;color:var(--ink)}
.ib .bd{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--accent);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:0 6px;line-height:18px;min-width:18px;text-align:center}
.chip-d{display:flex;align-items:center;gap:8px;background:var(--sand);border-radius:12px;padding:8px 14px;font-weight:600;white-space:nowrap}
.sbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;background:var(--cream);padding:0 12px;height:42px;width:min(320px,30vw);color:var(--muted)}
.sbox input{border:0;background:none;outline:0;flex:1;min-width:0;height:100%}
.pbtn{background:var(--sand);border:1px solid var(--line);border-radius:12px;padding:0 14px;height:42px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.pbtn.on{background:var(--brand);color:#fff}
.wrap{padding:20px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;max-width:1280px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:17px;font-weight:700}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(74,24,28,.25)}
.nav-d{display:flex;align-items:center;gap:6px;background:#fff;color:var(--ink);border-radius:16px;padding:4px;font-weight:700}
.nav-d button{border:0;background:var(--sand);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.nav-d span{padding:0 14px}
.eq{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center}
.eq .n{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 20px;text-align:center}
.eq small{display:block;opacity:.8}
.eq b{font-size:26px;font-weight:800;white-space:nowrap}
.eq i{opacity:.7;font-style:normal;font-size:22px}
.brk{display:flex;flex-direction:column;gap:2px;align-items:center;font-size:13px;opacity:.95;text-align:center}
.brk b{font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.gauto{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--muted)}
.kpi b{font-size:26px;font-weight:800;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--muted)}
.up{color:var(--good)}.dn{color:var(--bad)}.wn{color:var(--warn)}.mu{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 12px;font-size:12px;font-weight:700;background:var(--sand);color:var(--accent);white-space:nowrap}
.tag.good{background:var(--good-bg);color:var(--good)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.info{background:var(--info-bg);color:var(--info)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.btn{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:0 18px;height:42px;font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.sec{background:var(--sand);color:var(--ink)}
.btn.out{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad)}.btn.good{background:var(--good)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:grid;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--cream);cursor:pointer}
.row:hover{outline:1px solid var(--line)}
.list{display:flex;flex-direction:column;gap:8px}
.lh{display:grid;gap:10px;padding:8px 14px;color:var(--muted);font-size:12px;font-weight:600}
.r-bk{grid-template-columns:1.1fr 1.2fr .9fr 1.3fr .9fr .9fr auto}
.r-cl{grid-template-columns:1.4fr 1fr 1fr .8fr auto}
.r-dp{grid-template-columns:1.1fr 1.2fr .9fr .9fr .9fr .9fr auto}
.sub{color:var(--muted);font-size:12px}
.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 14px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--sand);border-color:var(--brand)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.tabs{display:flex;background:var(--sand);border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:none;border-radius:10px;padding:8px 18px;font-weight:700;flex:1}
.tabs button.on{background:var(--brand);color:#fff}
.in{width:100%;border:1px solid var(--line);border-radius:12px;padding:0 14px;height:42px;background:#fff;outline:0}
textarea.in{padding:10px 14px;height:auto;min-height:70px}
.in:focus{border-color:var(--brand)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-weight:700;font-size:13px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{height:8px;border-radius:99px;background:var(--sand);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.kv span:first-child{color:var(--muted)}
.kv b{font-weight:700;text-align:left}
.al{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--sand);cursor:pointer}
.al.bad{background:var(--bad-bg)}.al.warn{background:var(--warn-bg)}.al.good{background:var(--good-bg)}
.al b{display:block}
.al .sub{display:block}
.dcard{display:flex;flex-direction:column;gap:8px;cursor:pointer}
.dcard .ph{height:90px;border-radius:14px;background:var(--sand);display:grid;place-items:center;color:var(--accent);position:relative}
.dcard .ph .ic{width:40px;height:40px}
.dcard .ph .tag{position:absolute;top:8px;inset-inline-start:8px}
.dcard .code{position:absolute;bottom:8px;inset-inline-end:8px;background:#fff;color:var(--ink);border-radius:99px;padding:0 10px;font-weight:700;font-size:12px}
.pimg{width:54px;height:54px;border-radius:14px;object-fit:cover;flex:none;background:var(--sand)}.pimg.big{width:100%;height:auto;max-height:340px;border-radius:16px}.dcard .ph.has{height:170px;padding:0;overflow:hidden}.dcard .ph img{width:100%;height:100%;object-fit:cover}
.ov{position:fixed;inset:0;background:rgba(40,12,14,.45);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:16px}
.sheet{background:#fff;border-radius:22px;width:min(620px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.sheet.wide{width:min(780px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-direction:row-reverse;justify-content:space-between}
.mh h3{margin:0;font-size:20px;flex:1}
.mb{padding:16px 18px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;z-index:200;font-weight:600;max-width:90vw;text-align:center}
.tb{display:none}
.login{min-height:100vh;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(160deg,var(--brand),var(--brand2))}
.login .card{width:min(400px,100%);display:flex;flex-direction:column;gap:14px;padding:26px}
.login h2{margin:0;font-size:24px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;background:#f5f1ec;border-radius:12px;padding:14px;font-size:13px;direction:rtl;line-height:1.8}
.acc summary{cursor:pointer;font-weight:700;padding:6px 0;font-size:16px}
.acc{border-bottom:1px solid var(--line);padding:6px 0}
.pal{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:#fff;width:100%;text-align:right}
.pal.on{border-color:var(--brand);background:var(--cream)}
.sw{display:flex;gap:4px;margin-inline-start:auto}.sw i{width:20px;height:20px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.1)}
.tnum{font-variant-numeric:tabular-nums}
.sc{overflow-x:auto}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .sbox,.chip-d,.hd-only{display:none}
  .top h1{font-size:19px}
  .wrap{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .g2,.g3,.g4,.fg{grid-template-columns:1fr}
  .g4.k2{grid-template-columns:1fr 1fr}
  .lh{display:none}
  .r-bk,.r-cl,.r-dp{grid-template-columns:1fr 1fr}
  .eq b{font-size:22px}
  .tb{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:50;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));justify-content:space-around}
  .tb button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:0;font-size:11px;font-weight:600;color:var(--muted);padding:4px 8px;min-width:56px}
  .tb button.on{color:var(--brand)}
  .ov{align-items:end;padding:0}
  .sheet,.sheet.wide{width:100%;border-radius:22px 22px 0 0;max-height:92vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function itemInfo(code){
  const t=TODAY(),it=S.items[code]||{};
  const bs=bkList().filter(b=>b.itemCode===code&&b.status!=='cancelled');
  const out=bs.find(b=>b.status==='delivered');
  const next=bs.filter(b=>b.status==='booked').sort((a,b)=>a.deliverDate<b.deliverDate?-1:1)[0];
  const prep=bs.filter(b=>b.status==='returned'&&b.availableFrom&&b.availableFrom>t).sort((a,b)=>a.availableFrom<b.availableFrom?-1:1).pop();
  let st='available';
  if(it.off)st='off';else if(out)st='out';else if(prep)st='prep';else if(next&&next.deliverDate<=addD(t,2))st='reserved';
  return{st,out,next,prep,count:bs.filter(b=>b.status==='returned'||b.status==='delivered').length,rev:sum(payList().filter(p=>p.kind==='rent'&&bs.some(b=>b.id===p.bookingId)),p=>p.amount)};
}
function conflict(code,dFrom,dTo,except){
  const nEnd=addD(dTo,prepDays());
  return bkList().find(o=>o.id!==except&&o.itemCode===code&&(o.status==='booked'||o.status==='delivered')&&dFrom<endOf(o)&&o.deliverDate<nEnd);
}

/* ---------- Supabase document store (same interface the app was built on) ---------- */
function makeDb(sb){
  const cache={},loaded={},pend={},listeners={};let ch=null;
  const uid2=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const split=p=>{const a=p.split('/');const id=a.pop();return[a.join('/'),id]};
  const fire=col=>{(listeners[col]||[]).slice().forEach(l=>l())};
  function load(col,force){
    if(loaded[col]&&!force)return Promise.resolve();
    if(pend[col])return pend[col];
    pend[col]=(async()=>{
      const out={};let from=0;
      for(;;){
        const r=await sb.from('docs').select('id,data').eq('collection',col).order('id').range(from,from+999);
        if(r.error)throw r.error;
        r.data.forEach(x=>out[x.id]=x.data);
        if(r.data.length<1000)break;from+=1000;
      }
      cache[col]=out;loaded[col]=true;
    })().finally(()=>{delete pend[col]});
    return pend[col];
  }
  function ensureChannel(){
    if(ch)return;
    ch=sb.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
      const r=(p.new&&p.new.collection)?p.new:p.old;if(!r||!loaded[r.collection])return;
      if(p.eventType==='DELETE')delete cache[r.collection][r.id];else cache[r.collection][r.id]=p.new.data;
      fire(r.collection);
    }).subscribe();
    setInterval(()=>{Object.keys(loaded).forEach(c=>load(c,true).then(()=>fire(c)).catch(()=>{}))},90000);
  }
  function snapOf(col,q){
    const m=cache[col]||{};
    let docs=Object.keys(m).map(id=>({id,data:()=>m[id],metadata:{fromCache:false}}));
    if(q.ord){const f=q.ord[0],d=q.ord[1]==='desc'?-1:1;docs.sort((a,b)=>{const x=a.data()[f],y=b.data()[f];return x===y?0:(x<y?-d:d)})}
    else docs.sort((a,b)=>a.id<b.id?-1:1);
    if(q.lim)docs=docs.slice(0,q.lim);
    return{docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false}};
  }
  function local(col,id,d){if(loaded[col]){cache[col][id]=d;fire(col)}}
  function docRef(path){
    const sp=split(path),col=sp[0],id=sp[1];
    return{id,path,
      async get(){const r=await sb.from('docs').select('data').eq('collection',col).eq('id',id).maybeSingle();if(r.error)throw r.error;const d=r.data&&r.data.data;return{id,exists:!!d,data:()=>d,metadata:{fromCache:false}}},
      async set(d){const row={collection:col,id,data:d,updated_at:new Date().toISOString()};let r=await sb.from('docs').insert(row);if(r.error&&r.error.code==='23505')r=await sb.from('docs').upsert(row);if(r.error)throw r.error;local(col,id,d)},
      async update(d){const r=await sb.rpc('patch_doc',{p_collection:col,p_id:id,p_patch:d});if(r.error)throw r.error;if(loaded[col]&&cache[col][id])local(col,id,Object.assign({},cache[col][id],d))},
      async delete(){const r=await sb.from('docs').delete().eq('collection',col).eq('id',id);if(r.error)throw r.error;if(loaded[col]){delete cache[col][id];fire(col)}},
      collection:p=>colRef(path+'/'+p)};
  }
  function colRef(col,q){
    q=q||{};
    return{path:col,
      doc:id=>docRef(col+'/'+(id||uid2())),
      async add(d){const r=docRef(col+'/'+uid2());await r.set(d);return r},
      orderBy:(f,d)=>colRef(col,Object.assign({},q,{ord:[f,d||'asc']})),
      limit:n=>colRef(col,Object.assign({},q,{lim:n})),
      async get(){await load(col);return snapOf(col,q)},
      onSnapshot(next,err){
        let on=true;const l=()=>{if(on)next(snapOf(col,q))};
        (listeners[col]=listeners[col]||[]).push(l);
        load(col).then(()=>{if(on)l()}).catch(e=>{if(on&&err)err({code:'unavailable',message:e.message})});
        ensureChannel();
        return()=>{on=false;listeners[col]=(listeners[col]||[]).filter(x=>x!==l)};
      }};
  }
  return{doc:docRef,collection:p=>colRef(p)};
}

function statTag(st,map){return '<span class="tag '+map[st][1]+'">'+map[st][0]+'</span>'}
function donut(parts){
  const tot=sum(parts,p=>p.v)||1;let off=0;const R=52,C=2*Math.PI*R;
  const arcs=parts.filter(p=>p.v>0).map(p=>{const l=p.v/tot*C;const s='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+p.c+'" stroke-width="18" stroke-dasharray="'+l+' '+(C-l)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';off+=l;return s}).join('');
  return '<svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="توزيع القطع"><circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--sand)" stroke-width="18"/>'+arcs+'<text x="70" y="72" text-anchor="middle" font-size="26" font-weight="800" fill="var(--ink)" font-family="Cairo">'+sum(parts,p=>p.v)+'</text><text x="70" y="92" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Cairo">قطعة</text></svg>';
}
function lineChart(vals,labels){
  const W=640,H=220,pl=10,pr=10,pt=16,pb=28,mx=Math.max(1,...vals);
  const x=i=>pl+i*(W-pl-pr)/Math.max(1,vals.length-1),y=v=>pt+(H-pt-pb)*(1-v/mx);
  const pts=vals.map((v,i)=>x(i)+','+y(v)).join(' ');

function monthRange(d){const f=d.slice(0,8)+'01';const dt=pd(f);dt.setMonth(dt.getMonth()+1);dt.setDate(0);return[f,ymd(dt)]}

const sumPay=(f,t,k)=>sum(payList().filter(p=>p.kind===(k||'rent')&&p.day>=f&&p.day<=t&&!cancelledB(p.bookingId)),p=>p.amount);

function depStatus(b){
  const need=+b.dep||0,got=depIn(b),held=depHeld(b);
  if(b.status==='cancelled'&&held<=0)return['ملغي','bad'];
  if(need>got&&(b.status==='booked'||b.status==='delivered'))return['لسه ما اتدفعش','warn'];
  if(b.status==='returned'){if(held>0)return['محتاج رد','bad'];if((+b.fine||0)>0)return['اتخصم منه','warn'];return got>0?['اترد','good']:['—','']}
  return got>0?['مع الأتيليه','info']:['—',''];
}

function rng(per,d){

  if(per==='weekly')return[addD(d,-6),d,addD(d,-13),addD(d,-7)];
  if(per==='yearly'){const y=pd(d).getFullYear();return[y+'-01-01',y+'-12-31',(y-1)+'-01-01',(y-1)+'-12-31']}
  const m=monthRange(d),p=monthRange(addD(m[0],-1));return[m[0],m[1],p[0],p[1]];
}

    try{
      for(let i=0;i<rows.length;i+=100){
        const r=await sb.from('docs').upsert(rows.slice(i,i+100));
        if(r.error)throw r.error;
      }
      await logA('استرجاع نسخة احتياطية',rows.length+' سجل');
      U.restore=null;toast('تم الاسترجاع. هنحدّث الصفحة');
      setTimeout(()=>location.reload(),1200);
    }catch(e){toast('الاسترجاع وقف عند مشكلة: '+((e&&e.message)||'جرّبي تاني'))}
  },

  async ordSt(id,st){await run(async()=>{await patch('orders',id,{status:st});logA('طلب موقع',(S.orders[id]||{}).name+' ← '+OS[st][0])},'اتحدّث')},
  async ordDel(id){openM(sheet('حذف الطلب','<p>هيتحذف الطلب نهائيًا.</p><button class="btn bad" onclick="A.ordDelGo(\''+id+'\')">أيوه، احذفي</button>'),{st:1})},
  async ordDelGo(id){if(await run(async()=>{await del('orders',id)},'اتحذف'))closeM()},
  ordPhoto(id){const o=S.orders[id];if(!o||!o.photo)return;openM(sheet('صورة التصميم المطلوب','<img class="pimg big" alt="" src="'+o.photo+'"><button class="btn" onclick="A.ordDl(\''+id+'\')">تحميل الصورة</button>'),{st:1})},
  async ordDl(id){const o=S.orders[id];if(!o||!o.photo||!dl)return;try{const b=await (await fetch(o.photo)).blob();await dl.save({filename:'design-'+(o.name||'order')+'.jpg',data:b})}catch(e){toast('مقدرتش أحمّل الصورة')}},
  ordBook(id){const o=S.orders[id];if(!o)return;A.bkForm(o.itemCode,null,null,o.dFrom,o.dTo);setTimeout(()=>{const n=$('#bn'),p=$('#bp');if(n)n.value=o.name||'';if(p){p.value=o.phone||'';A.pickClientP(o.phone||'')}},120)},
  async reloadUsers(){await loadProfiles();render();toast(U.userErr?'مقدرتش أحمّل الحسابات':'اتحدّثت القايمة')},
  async backup(){
    if(!dl){toast('التحميل مش متاح هنا');return}
    const data=JSON.stringify({exportedAt:new Date().toISOString(),items:S.items,costs:S.costs,clients:S.clients,bookings:S.bookings,payments:S.payments,expenses:S.expenses,notes:S.notes,cfg:S.cfg,photos:S.photos,orders:S.orders},null,1);
    try{await dl.save({filename:'su-dresses-backup-'+TODAY()+'.json',data});toast('اتحفظت النسخة')}catch(e){if(!e||e.code!=='declined')toast('مقدرتش أحمّل النسخة')}
  },
  async csv(){
    if(!dl){toast('التحميل مش متاح هنا');return}
    const r=rng(U.rper,U.rdate),q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
    const rows=[['رقم الحجز','العميلة','القطعة','التسليم','الاستلام','الحالة','الإجمالي','المدفوع','المتبقي','التأمين','البائعة'].map(q).join(',')];
    bkList().filter(b=>b.deliverDate>=r[0]&&b.deliverDate<=r[1]).forEach(b=>rows.push([bkNo(b),clientName(b.clientId),b.itemCode,b.deliverDate,b.returnDate,ST[b.status][0],netTotal(b),paid(b),remain(b),b.dep,b.seller].map(q).join(',')));
    try{await dl.save({filename:'bookings-'+r[0]+'.csv',data:'﻿'+rows.join('\n')});toast('اتحفظ الملف')}catch(e){if(!e||e.code!=='declined')toast('مقدرتش أحمّل الملف')}
  },
  async clearDemo(){
    openM(sheet('مسح البيانات التجريبية','<p>هيتمسح كل اللي اتعلّم تجريبي: قطع وعملاء وحجوزات ودفعات ومصاريف. بياناتك الحقيقية مش هتتأثر. الأمر ده مينفعش يتراجع عنه.</p><button class="btn bad" onclick="A.doClear()">أيوه، امسحي</button>'),{st:1});
  },
  async doClear(){
    closeM();
    await run(async()=>{
      for(const c of ['bookings','payments','expenses','clients','items','notes']){
        const ids=Object.keys(S[c]).filter(k=>S[c][k].demo);
        for(const k of ids){await del(c,k);if(c==='items'){await del('costs',k);await del('photos',k)}}
      }
      logA('مسح بيانات تجريبية','')
    },'اتمسحت البيانات التجريبية');
  }
};
window.A=A;
window.U=U;
window.addEventListener('hashchange',()=>{U.q='';U.lim=50;render()});

/* ---------- boot ---------- */
(async function boot(){
  render();
  dl={async save(o){const b=o.data instanceof Blob?o.data:new Blob([o.data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=o.filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}};
  try{
    const C=window.SU_CONFIG||{};
    if(!C.url||!C.key||/PASTE/.test(C.url+C.key)||!window.supabase){db=null;L.boot=true;render();return}
    sb=window.supabase.createClient(C.url,C.key);
    sb2=window.supabase.createClient(C.url,C.key,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'su-aux'}});
    db=makeDb(sb);
    const hu=await sb.rpc('has_users');U.first=!hu.data;
    const ss=await sb.auth.getSession();
    if(ss.data&&ss.data.session)await enter(ss.data.session);
  }catch(e){toast('مشكلة في الاتصال: '+(e.message||''))}
  L.boot=true;render();
})();
})();
</script>
